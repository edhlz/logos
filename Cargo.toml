[workspace]
resolver = "2"

members = [
    "crates/framework",
    "crates/protocol",
    "crates/network",
    "crates/world",
    "crates/entity",
    "crates/registry",
    "crates/api",
    "crates/server",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
bevy_ecs = "0.18.1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"